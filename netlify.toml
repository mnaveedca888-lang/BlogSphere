[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin-full.html"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin-full.html"
  status = 301
  force = true

[[redirects]]
  from = "/blogsphere.db"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phase1-backup/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api-health"
  status = 200

[[redirects]]
  from = "/api/public-data"
  to = "/.netlify/functions/api-public-data"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/api-comments"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/api-contact"
  status = 200

# Static asset caching: images are content-addressed uploads, so they can be
# cached for a year; CSS/JS revalidate hourly so deploys reach readers fast;
# HTML is never cached so new pages and meta changes show immediately.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"